steps:
  # Step 1: Build WAR file using Maven
  - name: 'maven:3.9-eclipse-temurin-17'
    entrypoint: 'mvn'
    args: ['clean', 'package', '-DskipTests']

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/java-servlet-crud/java-servlet-crud:latest', '.']

  # Step 3: Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/java-servlet-crud/java-servlet-crud:latest']

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: ['run', 'deploy', 'java-servlet-crud',
           '--image', 'europe-west1-docker.pkg.dev/$PROJECT_ID/java-servlet-crud/java-servlet-crud:latest',
           '--region', 'europe-west1',
           '--platform', 'managed',
           '--allow-unauthenticated']